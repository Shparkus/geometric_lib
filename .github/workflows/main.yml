name: CI

on:
  push:
    branches: [ "test_437109" ]
  pull_request:
    branches: [ "test_437109" ]

jobs:
  test_ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Run circle unittests
      run: |
        python -m unittest test_circle.py
    - name: Run rectangle unittests
      run: |
        python -m unittest test_rectangle.py
    - name: Run square unittests
      run: |
        python -m unittest test_square.py      
    - name: Run triangle unittests
      run: |
        python -m unittest test_triangle.py
  
  test_windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install unittest
    - name: Run circle unittests
      run: |
        python -m unittest test_circle.py
    - name: Run rectangle unittests
      run: |
        python -m unittest test_rectangle.py
    - name: Run square unittests
      run: |
        python -m unittest test_square.py
    - name: Run triangle unittests
      run: |
        python -m unittest test_triangle.py
